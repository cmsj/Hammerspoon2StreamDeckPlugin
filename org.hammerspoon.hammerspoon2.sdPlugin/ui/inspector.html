<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Hammerspoon 2</title>
    <style>
        :root {
            --text: #d8d8d8;
            --muted: #969696;
            --field: #3d3d3d;
            --field-focus: #4a4a4a;
            --ok: #28c940;
            --warn: #ff9f0a;
            --bad: #ff453a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 12px 16px 12px 0;
            font: 9pt -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            color: var(--text);
            background: #2d2d2d;
        }
        .row { display: flex; align-items: center; margin-bottom: 8px; }
        .row > .label { flex: 0 0 96px; padding-right: 12px; text-align: right; color: var(--muted); }
        .row > .value { flex: 1; min-width: 0; }
        input {
            width: 100%;
            padding: 4px 6px;
            border: none;
            border-radius: 3px;
            background: var(--field);
            color: var(--text);
            font: inherit;
            outline: none;
        }
        input:focus { background: var(--field-focus); }
        .status { display: flex; align-items: center; gap: 6px; }
        .dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
        .dot.ok { background: var(--ok); }
        .dot.warn { background: var(--warn); }
        .dot.bad { background: var(--bad); }
        .hint { color: var(--muted); line-height: 1.4; }
        .id { font-family: ui-monospace, Menlo, monospace; font-size: 8pt; color: var(--muted); user-select: text; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <div class="row">
        <div class="label">Name</div>
        <div class="value">
            <input id="name" list="names" placeholder="e.g. mute" autocomplete="off" spellcheck="false" />
            <datalist id="names"></datalist>
        </div>
    </div>
    <div class="row">
        <div class="label">Hammerspoon</div>
        <div class="value status"><span id="dot" class="dot"></span><span id="status">Checking…</span></div>
    </div>
    <div class="row">
        <div class="label"></div>
        <div id="hint" class="value hint"></div>
    </div>
    <div class="row">
        <div class="label">ID</div>
        <div id="id" class="value id"></div>
    </div>

    <script>
        // Uses Stream Deck's property inspector WebSocket protocol directly: the only setting is
        // the name, and the plugin sends the connection status and the names the config uses.
        let websocket = null;
        let context = null;
        let action = null;
        let saveTimer = null;

        const nameField = document.getElementById("name");

        function send(event, payload) {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({ event, action, context, payload }));
            }
        }

        function save() {
            clearTimeout(saveTimer);
            saveTimer = null;
            send("setSettings", { name: nameField.value.trim() });
        }

        nameField.addEventListener("input", () => {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(save, 400);
        });
        nameField.addEventListener("change", save);

        function showStatus(message) {
            const dot = document.getElementById("dot");
            const status = document.getElementById("status");
            const hint = document.getElementById("hint");
            const s = message.status || { state: "waiting" };
            dot.className = "dot";
            if (s.state === "connected") {
                dot.classList.add("ok");
                status.textContent = `Connected (StreamDeckPlugin ${s.spoon})`;
                const names = message.knownNames || [];
                hint.textContent = names.length
                    ? "Pick a name your config uses, or type a new one."
                    : "Type the name your config uses for this key or dial.";
            } else if (s.state === "mismatch") {
                dot.classList.add("bad");
                status.textContent = `Update the ${s.update === "plugin" ? "Stream Deck plugin" : "StreamDeckPlugin Spoon"}`;
                hint.textContent = `The StreamDeckPlugin Spoon (${s.spoon}) and this plugin speak different protocol versions (${s.spoonProtocol} and ${message.pluginProtocol}).`;
            } else {
                dot.classList.add("warn");
                status.textContent = "Not connected";
                hint.textContent = "Start the StreamDeckPlugin Spoon in your Hammerspoon 2 config. This plugin connects to it automatically.";
            }

            const list = document.getElementById("names");
            list.replaceChildren(...(message.knownNames || []).map((name) => {
                const option = document.createElement("option");
                option.value = name;
                return option;
            }));
            if (message.id) document.getElementById("id").textContent = message.id;
        }

        // Called by Stream Deck when the property inspector loads
        function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
            context = uuid;
            const parsed = JSON.parse(actionInfo);
            action = parsed.action;
            nameField.value = (parsed.payload.settings && parsed.payload.settings.name) || "";
            document.getElementById("id").textContent = parsed.context || "";

            websocket = new WebSocket(`ws://127.0.0.1:${port}`);
            websocket.onopen = () => {
                websocket.send(JSON.stringify({ event: registerEvent, uuid }));
                send("sendToPlugin", { request: "status" });
            };
            websocket.onmessage = (ev) => {
                const message = JSON.parse(ev.data);
                if (message.event === "sendToPropertyInspector") {
                    showStatus(message.payload);
                } else if (message.event === "didReceiveSettings" && document.activeElement !== nameField) {
                    nameField.value = (message.payload.settings && message.payload.settings.name) || "";
                }
            };
        }
    </script>
</body>
</html>
